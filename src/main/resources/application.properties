spring.application.name=autopilot-backend
server.port=8080

# -----------------------------
# DATABASE CONFIG (MySQL)
# -----------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/autopilot?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------
# REDIS CONFIG
# -----------------------------
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000
spring.data.redis.connect-timeout=60000
spring.data.redis.repositories.enabled=false

# -----------------------------
# TERRAFORM CONFIG
# -----------------------------
terraform.directory=src/main/resources/terraform

# -----------------------------
# LOGGING
# -----------------------------
logging.level.root=INFO
logging.level.com.autopilot=DEBUG

# -----------------------------
# JWT CONFIG
# -----------------------------
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-minimum-32-chars!!}
jwt.expiration-ms=604800000

# -----------------------------
# LLM CONFIG (Universal Analyzer)
# -----------------------------
stellar.url=${STELLAR_URL:http://localhost:11434/api/generate}
stellar.model=${STELLAR_MODEL:llama3.2}

# -----------------------------
# PLATFORM CONFIG
# -----------------------------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# Managed mode: Autopilot's own AWS role for deploying on behalf of users
autopilot.platform.role-arn=${AUTOPILOT_PLATFORM_ROLE_ARN:}
autopilot.platform.region=${AUTOPILOT_PLATFORM_REGION:ap-south-1}

